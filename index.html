<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NiiVue Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@niivue/niivue@0.66.0/dist/niivue.umd.min.js"></script>
</head>
<body>
  <div id="left">
    <canvas id="viewer"></canvas>
    <div id="fileLoader">
      <input type="file" id="volumeInput">
      <button id="sample-btn" class="btn">load sample data</button>
    </div>
  </div>
  <div id="right">
    <button id="mode-btn" class="btn">mode: crosshair</button>
    <span id="info">load a volume</span>
    <canvas id="matrix-canvas"></canvas>
  </div>

  <script>

    // sets up everything, attaches to viewer etc
    const nv = new niivue.Niivue({
      crosshairColor: [0, 1, 1, 0.1],
      crosshairWidth: 0.2,
      show3Dcrosshair: true
    });
    const viewer = document.getElementById('viewer');
    const mc = document.getElementById('matrix-canvas');
    const ctx = mc.getContext('2d');
    const modeBtn = document.getElementById('mode-btn');
    const HALF = 4;
    let selectMode = false;

    nv.attachToCanvas(viewer);

    function resize() {
      viewer.width = viewer.parentElement.clientWidth;
      viewer.height = viewer.parentElement.clientHeight;
      nv.resizeListener();
    }
    resize();
    window.addEventListener('resize', resize);

    // load a volume and hides the file picker
    async function loadVolume(url, name) {
      await nv.loadVolumes([{ url: url, name: name }]);
      nv.setSliceType(nv.sliceTypeAxial);
      document.getElementById('fileLoader').style.display = 'none';
    }

    document.getElementById('volumeInput').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      loadVolume(URL.createObjectURL(file), file.name);
    });

    document.getElementById('sample-btn').addEventListener('click', async function(e) {
      e.target.disabled = true;
      e.target.textContent = 'loading...';
      try {
        await loadVolume('./ultrasound.nrrd', 'ultrasound.nrrd');
      } catch (err) {
        e.target.disabled = false;
        e.target.textContent = 'load sample data';
      }
    });

    // render voxel values as a labeled grayscale grid
    // getVolumeData returns dims as [X, Y, Z] and the collapsed axis has size 1
    // the first non 1 dim is cols, second is rows
    function drawMatrix(data, dims) {
      const vol = nv.volumes[0];
      const min = vol.cal_min;
      const max = vol.cal_max;
      const range = max - min || 1;

      // find the two visible axes and skip the collapses axis
      let cols, rows;
      for (let i = 0; i < 3; i++) {
        if (dims[i] > 1) {
          if (cols === undefined) cols = dims[i];
          else rows = dims[i];
        }
      }

      const cell = Math.floor(Math.min(mc.clientWidth / cols, mc.clientHeight / rows));
      mc.width = cols * cell;
      mc.height = rows * cell;
      ctx.font = Math.floor(cell * 0.28) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const val = data[c + (rows - 1 - r) * cols];
          const norm = (val - min) / range;
          const g = Math.round(norm * 255);

          ctx.fillStyle = 'rgb(' + g + ',' + g + ',' + g + ')';
          ctx.fillRect(c * cell, r * cell, cell, cell);

          ctx.fillStyle = norm > 0.55 ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.8)';
          ctx.fillText(val.toFixed(0), c * cell + cell / 2, r * cell + cell / 2);
        }
      }

      document.getElementById('info').textContent =
        cols + 'x' + rows + ' vox  [' + min.toFixed(0) + ', ' + max.toFixed(0) + ']';
    }

    // gets a neighborhood around the crosshair
    // loc.vox is already in RAS coordinates which is what getVolumeData needs
    // also getVolumeData clamps OOB coordinates itself so you don't need to deal with that
    nv.onLocationChange = function(loc) {
      if (!nv.volumes.length || selectMode) return;

      const vox = loc.vox;
      const voxStart = [vox[0] - HALF, vox[1] - HALF, vox[2] - HALF];
      const voxEnd   = [vox[0] + HALF, vox[1] + HALF, vox[2] + HALF];

      // collapses the slice plane axis to a single voxel
      // axial(0)  Z=2, coronal(1)  Y=1, sagittal(2)  X=0
      let fixedAxis = 2;
      if (nv.opts.sliceType === nv.sliceTypeCoronal)  fixedAxis = 1;
      if (nv.opts.sliceType === nv.sliceTypeSagittal) fixedAxis = 0;
      voxStart[fixedAxis] = vox[fixedAxis];
      voxEnd[fixedAxis]   = vox[fixedAxis];

      const result = nv.volumes[0].getVolumeData(voxStart, voxEnd);
      if (result[0] && result[1]) drawMatrix(result[0], result[1]);
    };

    // Handles box select mode. the drag coordinates already define a singleslice 
    nv.onDragRelease = function(info) {
      if (!nv.volumes.length || !selectMode) return;
      if (info.tileIdx < 0) return;

      const result = nv.volumes[0].getVolumeData(info.voxStart, info.voxEnd);
      if (result[0] && result[1]) drawMatrix(result[0], result[1]);
    };

    // toggle between crosshair and box select
    modeBtn.addEventListener('click', function() {
      selectMode = !selectMode;
      modeBtn.textContent = 'mode: ' + (selectMode ? 'box select' : 'crosshair');
      nv.opts.dragMode = selectMode ? nv.dragModes.callbackOnly : nv.dragModes.slicer3D;
    });
  </script>
</body>
</html>
