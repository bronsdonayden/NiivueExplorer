<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NiiVue Explorer</title>
  <script src="https://cdn.jsdelivr.net/npm/@niivue/niivue@0.66.0/dist/niivue.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }

    #left {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #viewer {
      position: absolute;
      width: 100%;
      height: 100%;
      display: block;
    }

    #fileLoader {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #fileLoader label, #fileLoader input { color: #aaa; font-size: 12px; }

    #sample-btn {
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      font-family: monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    #sample-btn:hover { background: #333; color: #fff; }
    #sample-btn:disabled { color: #555; cursor: default; }

    #right {
      width: 50vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border-left: 1px solid #222;
      overflow: hidden;
      flex-shrink: 0;
    }

    #mode-btn {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      font-family: monospace;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: fit-content;
    }
    #mode-btn:hover { background: #333; }
    #mode-btn.active { border-color: #fff; }

    #info { color: #aaa; font-size: 11px; }

    #matrix-canvas {
      display: block;
      flex: 1;
      min-height: 0;
      width: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    #tooltip {
      position: fixed;
      display: none;
      background: rgba(0,0,0,0.85);
      color: #fff;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 3px 7px;
      font-size: 11px;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="left">
    <canvas id="viewer"></canvas>
    <div id="fileLoader">
      <label for="volumeInput">Volume (.nii, .nrrd, .nii.gz...)</label>
      <input type="file" id="volumeInput">
      <button id="sample-btn">load sample data</button>
    </div>
  </div>
  <div id="right">
    <button id="mode-btn">mode: hover</button>
    <span id="info">load a volume and hover over the viewer</span>
    <canvas id="matrix-canvas"></canvas>
  </div>
  <div id="tooltip"></div>

  <script>
    // setup
    const nv = new niivue.Niivue({ textHeight: 0.02, crosshairColor: [0,1,1,0.1], crosshairWidth: 0.2, show3Dcrosshair: true });
    const viewerCanvas = document.getElementById('viewer');
    const matrixCanvas = document.getElementById('matrix-canvas');
    const ctx = matrixCanvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const HALF = 4;

    let selectMode = false;
    let mState = { data: null, dims: null };

    nv.attachToCanvas(viewerCanvas);

    // resize on window change
    function resizeViewer() {
      viewerCanvas.width = viewerCanvas.parentElement.clientWidth;
      viewerCanvas.height = viewerCanvas.parentElement.clientHeight;
      nv.resizeListener();
    }
    resizeViewer();
    window.addEventListener('resize', resizeViewer);

    // loading
    async function loadVolume(url, name) {
      await nv.loadVolumes([{ url, name }]);
      nv.setSliceType(nv.sliceTypeAxial);
      document.getElementById('fileLoader').style.display = 'none';
    }

    document.getElementById('volumeInput').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) loadVolume(URL.createObjectURL(f), f.name);
    });

    document.getElementById('sample-btn').addEventListener('click', async (e) => {
      e.target.disabled = true;
      e.target.textContent = 'loading...';
      try {
        await loadVolume('./ultrasound.nrrd', 'ultrasound.nrrd');
      } catch (err) {
        e.target.disabled = false;
        e.target.textContent = 'load sample data';
      }
    });

    // figure out what voxel neighborhood the mouse is over
    function getRegion(canvasX, canvasY) {
      if (!nv.volumes.length || nv.opts.sliceType === nv.sliceTypeMultiplanar) return null;

      const frac = nv.canvasPos2frac([canvasX, canvasY]);
      if (!frac || frac.some(f => f < 0 || f > 1)) return null;

      const st = nv.opts.sliceType;
      const v = nv.volumes[0];
      const [vx, vy, vz] = v.convertFrac2Vox(frac);
      const [nx, ny, nz] = [v.dims[1], v.dims[2], v.dims[3]];

      const clamp = (val, max) => Math.max(0, Math.min(max - 1, Math.round(val)));

      // build a 3D box around the cursor then flatten the axis that doesnt change
      let start = [clamp(vx-HALF, nx), clamp(vy-HALF, ny), clamp(vz-HALF, nz)];
      let end   = [clamp(vx+HALF, nx), clamp(vy+HALF, ny), clamp(vz+HALF, nz)];

      if      (st === nv.sliceTypeAxial)    { start[2] = end[2] = clamp(vz, nz); }
      else if (st === nv.sliceTypeCoronal)  { start[1] = end[1] = clamp(vy, ny); }
      else if (st === nv.sliceTypeSagittal) { start[0] = end[0] = clamp(vx, nx); }
      else return null;

      const [data, dims] = v.getVolumeData(start, end);
      return (data && dims) ? { data, dims, st } : null;
    }

    // draw the matrix
    function drawMatrix({ data, dims, st }) {
      const v = nv.volumes[0];
      const min = v.cal_min ?? Math.min(...data);
      const max = v.cal_max ?? Math.max(...data);
      const range = max - min || 1;

      // dims comes back as [X, Y, Z] coronal and sagittal have one axis = 1
      // so we need to pick the right two depending on which slice we're on.
      // also rows have to go bottom to top or the matrix is upside down
      let cols, rows;
      if (st === nv.sliceTypeAxial)         { cols = dims[0]; rows = dims[1]; }
      else if (st === nv.sliceTypeCoronal)  { cols = dims[0]; rows = dims[2]; }
      else                                  { cols = dims[1]; rows = dims[2]; }

      const cellSize = Math.floor(Math.min(
        matrixCanvas.clientWidth / cols,
        matrixCanvas.clientHeight / rows
      ));

      mState = { data, dims: [cols, rows] };
      matrixCanvas.width = cols * cellSize;
      matrixCanvas.height = rows * cellSize;

      ctx.font = Math.floor(cellSize * 0.28) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const val = data[c + (rows - 1 - r) * cols];
          const norm = Math.max(0, Math.min(1, (val - min) / range));
          const g = Math.round(norm * 255);

          ctx.fillStyle = `rgb(${g},${g},${g})`;
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);

          if (cellSize >= 6) {
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(c * cellSize + 0.5, r * cellSize + 0.5, cellSize - 1, cellSize - 1);
          }

          ctx.fillStyle = norm > 0.55 ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.8)';
          ctx.fillText(val.toFixed(0), c * cellSize + cellSize / 2, r * cellSize + cellSize / 2);
        }
      }

      document.getElementById('info').textContent =
        `${cols}x${rows} vox  [${min.toFixed(0)}, ${max.toFixed(0)}]`;
    }

    // events
    viewerCanvas.addEventListener('mousemove', (e) => {
      if (selectMode || !nv.volumes.length) return;
      const rect = viewerCanvas.getBoundingClientRect();
      const region = getRegion(e.clientX - rect.left, e.clientY - rect.top);
      // console.log(region);
      if (region) drawMatrix(region);
    });

    matrixCanvas.addEventListener('mousemove', (e) => {
      if (!mState.data) return;
      const { data, dims } = mState;
      const rect = matrixCanvas.getBoundingClientRect();
      const c = Math.floor((e.clientX - rect.left) / rect.width  * dims[0]);
      const r = Math.floor((e.clientY - rect.top)  / rect.height * dims[1]);

      if (c >= 0 && c < dims[0] && r >= 0 && r < dims[1]) {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 12) + 'px';
        tooltip.style.top = (e.clientY - 24) + 'px';
        tooltip.textContent = `[${c},${r}] = ${data[c + (dims[1] - 1 - r) * dims[0]].toFixed(0)}`;
      }
    });
    matrixCanvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');

    // box select (wip)
    const modeBtn = document.getElementById('mode-btn');
    modeBtn.addEventListener('click', () => {
      selectMode = !selectMode;
      modeBtn.textContent = 'mode: ' + (selectMode ? 'box select' : 'hover');
      modeBtn.classList.toggle('active', selectMode);
      nv.opts.dragMode = selectMode ? nv.dragModes.callbackOnly : nv.dragModes.slicer3D;
      nv.onDragRelease = selectMode ? (...args) => {
        // TODO the box select so that the region selected shows up in the matrix
      } : null;
    });
  </script>
</body>
</html>
