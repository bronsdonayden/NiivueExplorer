<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NiiVue Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@niivue/niivue@0.66.0/dist/niivue.umd.min.js"></script>
</head>
<body>
  <div id="left">
    <canvas id="viewer"></canvas>
    <input type="file" id="volumeInput" title="Load a volume">
  </div>
  
  <div id="right">
    <span id="info">loading</span>
    <canvas id="matrix-canvas"></canvas>
  </div>

  <script>
    // sets up everything, attaches to viewer etc
    const nv = new niivue.Niivue({
      crosshairColor: [0, 1, 1, 0.1],
      crosshairWidth: 0.2,
      show3Dcrosshair: true,
      textHeight: 0
    });

    const viewer = document.getElementById('viewer');
    const mc = document.getElementById('matrix-canvas');
    const ctx = mc.getContext('2d');
    const infoBox = document.getElementById('info');
    
    // 9x9 hover neighborhood
    const HALF = 4; 
    let boxActive = false;

    nv.attachToCanvas(viewer);

    // handles window resize 
    function resize() {
      viewer.width = viewer.parentElement.clientWidth;
      viewer.height = viewer.parentElement.clientHeight;
      nv.resizeListener();
    }
    window.addEventListener('resize', resize);
    resize();

    // enables native drag selection
    nv.opts.dragMode = 5; 

    // gets fractional coordinates from mouse event
    function fracAt(e) {
      const rect = viewer.getBoundingClientRect();
      const frac = nv.canvasPos2frac([e.clientX - rect.left, e.clientY - rect.top]);
      return frac && frac[0] >= 0 ? frac : null;
    }

    // samples region and draws it
    function sampleRegion(voxA, voxB) {
      if (!nv.volumes.length || !voxA || !voxB) return;
      
      // collapses the slice plane axis to a single voxel
      // axial(0) Z=2, coronal(1) Y=1, sagittal(2) X=0
      const fixedAxis = nv.opts.sliceType === nv.sliceTypeSagittal ? 0 
                      : nv.opts.sliceType === nv.sliceTypeCoronal ? 1 : 2;
      
      const s = [...voxA];
      const end = [...voxB];
      s[fixedAxis] = end[fixedAxis] = Math.round((voxA[fixedAxis] + voxB[fixedAxis]) / 2);

      const [data, dims] = nv.volumes[0].getVolumeData(s, end);
      if (data && dims) drawMatrix(data, dims);
    }

    // creates the blue overlay if it does not exist
    async function ensureOverlayLoaded() {
      if (nv.volumes.length > 1) return;
      const overlay = await nv.volumes[0].clone();
      overlay.zeroImage(); 
      overlay.colormap = 'blue';
      overlay.opacity = 0.3;
      overlay.cal_min = 0;
      overlay.cal_max = 1;
      nv.addVolume(overlay);
    }

    // gets a neighborhood around the crosshair
    // loc.vox is already in RAS coordinates which is what getVolumeData needs
    // also getVolumeData clamps OOB coordinates itself so you dont need to deal with that
    nv.onLocationChange = function(loc) {
      if (boxActive || !nv.volumes.length) return;
      const v = loc.vox;
      sampleRegion(
        [v[0] - HALF, v[1] - HALF, v[2] - HALF],
        [v[0] + HALF, v[1] + HALF, v[2] + HALF]
      );
    };

    // clear box and resume hover on left click
    viewer.addEventListener('mousedown', function(e) {
      if (e.button === 0 && boxActive) {
        boxActive = false;
        
        if (nv.volumes.length > 1) {
          nv.volumes[1].zeroImage();
          nv.updateGLVolume();
        }

        const frac = fracAt(e);
        if (frac) {
          const v = nv.frac2vox(frac);
          sampleRegion(
            [v[0] - HALF, v[1] - HALF, v[2] - HALF],
            [v[0] + HALF, v[1] + HALF, v[2] + HALF]
          );
        }
      }
    });

    // handles box select mode the drag coordinates already define a single slice
    nv.onDragRelease = async function(info) {
      if (info.voxStart[0] < 0) return; 
      boxActive = true; 

      await ensureOverlayLoaded();
      nv.volumes[1].zeroImage();

      // collapses the slice plane axis to a single voxel
      // axial(0) Z=2, coronal(1) Y=1, sagittal(2) X=0
      const fixedAxis = nv.opts.sliceType === nv.sliceTypeSagittal ? 0 
                      : nv.opts.sliceType === nv.sliceTypeCoronal ? 1 : 2;
      
      const start = [...info.voxStart];
      const end = [...info.voxEnd];
      start[fixedAxis] = end[fixedAxis] = Math.round((info.voxStart[fixedAxis] + info.voxEnd[fixedAxis]) / 2);

      const [data, dims] = nv.volumes[0].getVolumeData(start, end);
      
      const boxVoxels = new Float32Array(data.length).fill(1);
      nv.volumes[1].setVolumeData(start, end, boxVoxels);
      nv.updateGLVolume();

      if (data && dims) drawMatrix(data, dims);
    };

    // loads initial volume
    (async () => {
      try {
        await nv.loadVolumes([{ url: './ultrasound.nrrd', name: 'ultrasound.nrrd' }]);
        nv.setSliceType(nv.sliceTypeAxial);
        infoBox.textContent = 'Hover to inspect, right click drag to select';
      } catch {
        infoBox.textContent = 'failed to load';
      }
    })();

    // load a volume from file picker
    document.getElementById('volumeInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await nv.loadVolumes([{ url: URL.createObjectURL(file), name: file.name }]);
      nv.setSliceType(nv.sliceTypeAxial);
      
      if (nv.volumes.length > 1) {
        nv.removeVolume(nv.volumes[1]);
        boxActive = false;
      }
    });

    // render voxel values as a labeled grayscale grid
    function drawMatrix(data, dims) {
      const { cal_min, cal_max } = nv.volumes[0];
      const range = cal_max - cal_min || 1;

      // getVolumeData returns dims as X Y Z and the collapsed axis has size 1
      // the first non 1 dim is cols second is rows
      const [cols, rows] = dims.filter(d => d > 1);
      if (!cols || !rows) return;

      const cell = Math.floor(Math.min(mc.clientWidth / cols, mc.clientHeight / rows));
      if (cell < 1) return;

      mc.width = cols * cell;
      mc.height = rows * cell;

      const showLabels = cell >= 8;
      if (showLabels) {
        ctx.font = `${Math.max(Math.floor(cell * 0.28), 6)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
      }

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const val = data[c + (rows - 1 - r) * cols];
          const norm = (val - cal_min) / range;
          const g = Math.round(norm * 255);

          ctx.fillStyle = `rgb(${g},${g},${g})`;
          ctx.fillRect(c * cell, r * cell, cell, cell);

          if (showLabels) {
            ctx.fillStyle = norm > 0.55 ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.8)';
            ctx.fillText(val.toFixed(0), c * cell + cell / 2, r * cell + cell / 2);
          }
        }
      }

      infoBox.textContent = `${cols}x${rows} vox [${cal_min.toFixed(0)}, ${cal_max.toFixed(0)}]`;
    }
  </script>
</body>
</html>
